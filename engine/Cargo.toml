[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.5.1"
edition = "2024"
rust-version = "1.93"
license = "AGPL-3.0-or-later"  # + plugin exception, see LICENSE-EXCEPTIONS.md

[workspace.dependencies]
puppetcat-core = { path = "crates/puppetcat-core" }
puppetcat-media = { path = "crates/puppetcat-media" }
puppetcat-project = { path = "crates/puppetcat-project" }
puppetcat-render = { path = "crates/puppetcat-render" }
puppetcat-export = { path = "crates/puppetcat-export" }
puppetcat-host = { path = "crates/puppetcat-host" }
puppetcat-speech = { path = "crates/puppetcat-speech" }
puppetcat-effects = { path = "crates/puppetcat-effects" }
puppetcat-text = { path = "crates/puppetcat-text" }

serde_json = "1"
thiserror = "2"
clap = { version = "4", features = ["derive"] }

# The GPU compositor, behind puppetcat-render's `gpu` feature. A heavy tree, which
# is exactly why it is optional: engine-only work never pays for it. Pinned to
# the major Slint 1.17 can share a device with, so the window's renderer and
# the engine's compositor draw on one device and a preview frame never leaves
# the GPU.
wgpu = "29"
pollster = "0.4"

[workspace.lints.rust]
missing_docs = "warn"

[workspace.lints.clippy]
# Cleverness is the enemy of a codebase you maintain alone.
too_many_arguments = "allow"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

# For trying a change in the window: `cargo run --profile quick -p puppetcat`.
# Optimised enough that video plays as it would in release, without the
# thin LTO and single codegen unit that make a release rebuild a
# minutes-long relink. Incremental, so a change in one crate is seconds.
[profile.quick]
inherits = "release"
lto = false
codegen-units = 16
incremental = true

# The shipping build of the editor window: `cargo build --profile app -p puppetcat`.
#
# Every knob here is set for the fastest possible binary, and each one costs
# build time. It is a separate profile rather than settings on `release`
# because two of them are wrong for the rest of the workspace: `panic =
# "abort"` breaks `cargo test --release`, and stripping symbols is only
# harmless for a binary nobody profiles. Measured on the R&D tree it came
# from, on an M5: clean build 3m18s, binary 22MB, of which about 1.7MB is
# the fonts and effect previews the build script embeds.
#
# What is deliberately not done, so nobody goes looking for it twice:
#
#   - No `-C target-cpu=native`. It makes the binary local-only, and the
#     research tree that used it says so in its own .cargo/config.toml.
#   - No alternative allocator. It is a dependency for a win nobody has
#     measured.
#   - Skia's partial rendering is still off, and cannot be turned on from
#     here: every dirty property redraws the whole window on every GPU
#     surface. That is the shape of the UI's frame cost, and no flag in this
#     file changes it.
[profile.app]
inherits = "release"
# Fat LTO: re-optimise the whole dependency graph - slint, skia, winit and
# the UI crate - as one unit, so calls across crate boundaries inline.
lto = "fat"
# No unwind tables and no landing pads: every call site loses its unwind
# edge, which frees the optimiser and shrinks the binary. This is a GUI
# binary with no tests and no catch_unwind, and unwinding through the ObjC
# frames of the macOS event loop was never well-defined anyway - winit only
# catches panics to avoid exactly that.
panic = "abort"
# Symbols are worth nothing in a release binary that is not being profiled.
# Build with `--profile release` instead before running Instruments or perf.
strip = "symbols"

# Decoding and compositing are unusably slow in an unoptimised build, even when
# the rest of the engine is being debugged.
[profile.dev.package."*"]
opt-level = 2

# wgpu-core's own debug-assertion-gated lock-recursion tracer stores its state
# in a thread-local and reads it back with a plain (panicking) access rather
# than a `try_with` - harmless while the program runs, but the window's GPU
# queue is torn down late enough (see puppetcat's `Shell::uninstall`) that on
# some runs it is the *last* thread-local standing when the OS starts tearing
# the main thread's down, and that plain access aborts the process. The
# tracer is debug-only (`cfg(debug_assertions)` in wgpu-core), so turning off
# debug assertions for just this one dependency removes it without giving up
# assertions anywhere in our own code.
[profile.dev.package.wgpu-core]
debug-assertions = false
