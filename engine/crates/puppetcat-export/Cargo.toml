[package]
name = "puppetcat-export"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Rendering a timeline to a file, and one true frame of it to a monitor. The engine's ownership of what the pixels mean."

[features]
# The GPU compositor for full exports. Off by default for the same reason as
# puppetcat-render's: engine-only work never pays for the wgpu tree.
gpu = ["puppetcat-render/gpu"]

[dependencies]
puppetcat-core.workspace = true
puppetcat-media.workspace = true
puppetcat-render.workspace = true
puppetcat-project = { path = "../puppetcat-project" }
puppetcat-effects.workspace = true
serde = { version = "1", features = ["derive"] }

[lints]
workspace = true
