[package]
name = "puppetcat-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Command line driver for the PuppetCat engine."

# `puppetcat` is the editor window's binary; the driver gets the suffix.
[[bin]]
name = "puppetcat-cli"
path = "src/main.rs"

[dependencies]
puppetcat-core.workspace = true
puppetcat-media.workspace = true
puppetcat-render = { workspace = true, features = ["gpu"] }
clap.workspace = true

[lints]
workspace = true
